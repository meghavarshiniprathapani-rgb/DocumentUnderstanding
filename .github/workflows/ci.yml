name: Retrieva AI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-lint-test:
    name: Build, Lint & Test (Python 3.11 & Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Run Python Linters (Ruff)
        run: |
          ruff check backend eval tests

      - name: Run Frontend Linters (Oxlint)
        run: |
          npm run lint

      - name: Run Zero-Leakage Audit
        run: |
          python -m eval.leakage

      - name: Run Backend Pytest Suite
        run: |
          pytest tests -v

      - name: Run Multi-Modal Evaluation Suite
        run: |
          python -m eval.runner

      - name: Build Frontend Application
        run: |
          npm run build

