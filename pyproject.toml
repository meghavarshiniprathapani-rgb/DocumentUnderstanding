[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieva-ai"
version = "1.0.0"
description = "Retrieva AI — Document Understanding & Multi-Modal Spatial Retrieval System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Meghavarshini Prathapani", email = "meghavarshini@retrieva.ai" }
]
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.20",
    "pyyaml==6.0.3",
    "docling==2.144.0",
    "pymupdf==1.28.2",
    "pdfplumber==0.11.10",
    "faiss-cpu==1.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "ruff==0.9.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers -W ignore::DeprecationWarning"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
